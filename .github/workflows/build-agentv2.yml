name: Build agentv2 image

on:
  workflow_dispatch:
  push:
    branches:
      - agentv2

permissions:
  contents: read
  packages: write

concurrency:
  group: agentv2-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qidaooo/sub2api

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read upstream release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < UPSTREAM_RELEASE)"
          version="${tag#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid UPSTREAM_RELEASE: $tag" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run agentv2 tests
        working-directory: backend
        run: go test ./internal/config ./internal/handler ./internal/service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=agentv2
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=agentv2-
          labels: |
            org.opencontainers.image.source=https://github.com/qidaooo/sub2api
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=agentv2-${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
            BUILD_TYPE=custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
